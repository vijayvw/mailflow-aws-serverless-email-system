<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #222222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid #eeeeee;
      color: #777777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Welcome to MailFlow!</h1>

    <p>Hello {{name}},</p>

    <p>
      Thank you for joining us.
      We are excited to have you with us.
    </p>

    <p>
      This is a personalized email sent using the MailFlow
      email campaign system.
    </p>

    <div class="footer">
      Best regards,<br>
      <strong>MailFlow Team</strong>
    </div>

  </div>

</body>
</html>
